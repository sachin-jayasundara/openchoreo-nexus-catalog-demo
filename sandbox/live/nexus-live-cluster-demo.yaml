    nexus.demo/dataset: nexus-catalog
    app.kubernetes.io/name: nexus-live-collector
spec:
  replicas: 1
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: nexus-live-collector
  template:
    metadata:
      labels: *id001
      annotations:
        nexus.demo/config-checksum: c9705e8d710f473f
    spec:
      serviceAccountName: nexus-live-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: collector
        image: python:3.12-alpine
        command:
        - python
        - /app/collector.py
        - serve
        - --config
        - /app/config.json
        - --port
        - '8080'
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: nexus-live-collector
