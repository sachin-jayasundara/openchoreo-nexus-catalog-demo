name: Portal image

# Builds the OpenChoreo portal (openchoreo/backstage-plugins) with the Nexus insights plugin from portal/
# and publishes it as a drop-in replacement for ghcr.io/openchoreo/openchoreo-ui.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - portal/**
      - .github/workflows/portal-image.yml

env:
  UPSTREAM_REF: v1.2.2
  IMAGE: ghcr.io/${{ github.repository_owner }}/openchoreo-portal-nexus

permissions:
  contents: read
  packages: write

concurrency:
  group: portal-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: openchoreo/backstage-plugins
          ref: ${{ env.UPSTREAM_REF }}
          path: upstream

      - name: Apply the Nexus insights overlay
        run: python3 portal/apply_overlay.py upstream

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Type-check
        working-directory: upstream
        run: |
          yarn install --immutable --mode=skip-build
          yarn tsc

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/packages/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.UPSTREAM_REF }}-nexus
            ${{ env.IMAGE }}:${{ env.UPSTREAM_REF }}-nexus.${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=OpenChoreo ${{ env.UPSTREAM_REF }} portal with the Nexus insights plugin
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: |
          echo "Pushed \`${IMAGE}:${UPSTREAM_REF}-nexus.${{ github.run_number }}\` (also tagged \`${UPSTREAM_REF}-nexus\`)." >> "$GITHUB_STEP_SUMMARY"
